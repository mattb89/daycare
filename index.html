<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daycare Case File — Nopal Valley to Lackland AFB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-eyebrow">Case file</span>
      <h1>Daycare Ranking</h1>
      <p class="brand-sub" id="route-sub">Nopal Valley &rarr; daycare &rarr; JBSA-Lackland</p>
    </div>
    <div class="file-actions">
      <span id="file-status" class="file-status">No file open — showing bundled data.json</span>
      <button id="btn-open" class="btn btn-ghost">Open data file&hellip;</button>
      <button id="btn-save" class="btn btn-primary" disabled>Save</button>
      <button id="btn-download" class="btn btn-ghost">Download updated file</button>
      <input type="file" id="file-input" accept="application/json" style="display:none">
    </div>
  </div>
</header>

<main class="layout">

  <aside class="sidebar">
    <h2 class="sidebar-title">Priorities</h2>
    <p class="sidebar-hint">Slide to change what matters most. The ranking updates live.</p>
    <div id="weights-panel"></div>

    <div class="sidebar-divider"></div>
    <button id="btn-add" class="btn btn-outline btn-block">+ Add a daycare</button>
  </aside>

  <section class="results">
    <div class="results-header">
      <h2 id="results-count">10 candidates</h2>
      <span class="results-hint">Tap a card to open its full file</span>
    </div>
    <div id="card-list" class="card-list"></div>
  </section>

</main>

<template id="card-template">
  <article class="card" data-id="">
    <div class="card-summary">
      <div class="rank-badge"><span class="rank-num"></span></div>
      <div class="card-summary-main">
        <h3 class="card-name"></h3>
        <p class="card-address"></p>
        <div class="card-chips">
          <span class="chip chip-trip"></span>
          <span class="chip chip-total"></span>
        </div>
      </div>
      <div class="card-tags-preview"></div>
      <button class="card-toggle" aria-label="Expand">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 7l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="card-detail">
      <div class="detail-grid">

        <div class="detail-block">
          <h4>Location</h4>
          <p class="detail-address"></p>
          <a class="maps-link" target="_blank" rel="noopener">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-13A7 7 0 1 0 5 9c0 5.42 7 13 7 13z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.3" stroke="currentColor" stroke-width="1.8"/></svg>
            Open in Google Maps
          </a>
          <p class="detail-phone"></p>
          <label class="field-label">Trip time (home &rarr; daycare &rarr; base)</label>
          <input type="text" class="input trip-input" placeholder="e.g. ~30 min">
        </div>

        <div class="detail-block">
          <h4>Scores <span class="detail-total-inline"></span></h4>
          <div class="scores-grid"></div>
        </div>

        <div class="detail-block detail-block-wide">
          <h4>Parent reviews</h4>
          <ul class="reviews-list"></ul>
          <p class="inspection-note"></p>
        </div>

        <div class="detail-block detail-block-wide">
          <h4>Tags</h4>
          <div class="tags-editor">
            <div class="tag-chips"></div>
            <input type="text" class="input tag-input" placeholder="Add a tag and press Enter (e.g. favorite, toured, too far)">
          </div>
        </div>

        <div class="detail-block detail-block-wide">
          <h4>Your notes</h4>
          <textarea class="input notes-textarea" rows="4" placeholder="Anything from a call or tour, questions to ask, gut feel..."></textarea>
        </div>

        <div class="detail-block detail-block-wide detail-footer">
          <button class="btn btn-ghost btn-small btn-remove">Remove this daycare</button>
        </div>

      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
